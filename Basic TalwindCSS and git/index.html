<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-cyan-500 via-blue-500 to-indigo-600">

    <main class="flex min-h-screen items-center justify-center px-5">

        <div class="w-full max-w-sm rounded-2xl bg-white/95 p-8 shadow-2xl">

            <h1 class="text-center text-2xl font-semibold text-gray-800 ">
                Login
            </h1>

            <form class="space-y-5">

                <div>
                    <label class="mb-2 block text-sm font-medium text-gray-700">
                        Username
                    </label>

                    <input type="text" placeholder="Enter your username"
                        class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200">
                </div>

                <div>
                    <label class="mb-2 block text-sm font-medium text-gray-700">
                        Password
                    </label>

                    <input type="password" placeholder="Enter your password"
                        class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200">
                </div>


                <button
                    class="w-full rounded-lg bg-blue-600 py-3 font-semibold text-white transition hover:bg-blue-700 active:scale-95">
                    Login
                </button>

            </form>
        </div>

    </main>

</body>

</html>
